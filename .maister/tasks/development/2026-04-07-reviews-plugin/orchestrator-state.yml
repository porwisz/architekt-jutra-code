task:
  title: "Reviews Plugin Implementation"
  description: "Implement a new 'reviews' plugin for the existing microkernel (plugin-based) Spring Boot platform. The plugin adds product review and rating functionality: individual reviews stored as plugin_objects, per-product rating summaries in pluginData, four extension points (product.detail.tabs, product.detail.info, product.list.filters, menu.main), and no custom backend Java code for v1."
  status: completed
  tags: [plugin, reviews, microkernel, spring-boot, frontend]
  priority: medium

