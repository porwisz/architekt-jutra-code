task:
  title: Footprint Calculation Engine
  description: |
    Implement the carbon footprint calculation engine as a core (kernel) service for the aj platform.
    Stateless calculator + thin REST surface + async audit log + CSV exporter, designed and specified
    in product-design task 2026-05-20-footprint-calc-engine. Dual surface (Spring bean +
    REST GET /api/products/{id}/footprint), pure-math API, configurable strictness, async audit via
    @TransactionalEventListener(AFTER_COMMIT), Pricing Archetype reuse.
  status: in_progress
  tags: [sustainability, calculation-engine, kernel, pricing-archetype]
  priority: high

