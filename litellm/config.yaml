model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-4o-nano
    litellm_params:
      model: openai/gpt-4o-nano
      api_key: os.environ/OPENAI_API_KEY

  - model_name: claude-opus
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_key: os.environ/ANTHROPIC_API_KEY
      drop_params: true

  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
      drop_params: true

  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
      drop_params: true
  - model_name: groq-compound-mini
    litellm_params:
      model: groq/compound-mini
      api_key: os.environ/GROQ_API_KEY
      drop_params: true
  - model_name: groq-compound
    litellm_params:
      model: groq/compound
      api_key: os.environ/GROQ_API_KEY
      drop_params: true
  - model_name: groq-llama-scout
    litellm_params:
      model: meta-llama/llama-4-scout-17b-16e-instruct
      api_key: os.environ/GROQ_API_KEY
      drop_params: true

guardrails:
  - guardrail_name: "presidio-pii"
    litellm_params:
      guardrail: presidio
      mode: "pre_call"
      default_on: true
      presidio_ad_hoc_recognizers: "presidio_recognizers.json"
      pii_entities_config:
        CREDIT_CARD: BLOCK
        PHONE_NUMBER: MASK
        EMAIL_ADDRESS: MASK
        PL_PESEL: MASK

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
  store_prompts_in_spend_logs: true
  forward_client_headers_to_llm_api: true  # Required: forwards OAuth token to Anthropic


litellm_settings:
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  drop_params: true